[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-free-tier-hunter"
version = "1.0.0"
description = "Autonomous OCI Capacity Monitor, Free Resource Optimizer & Immediate Auto-Provisioner for Arma Reforger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oci>=2.189.0",
    "pydantic>=2.10.0",
    "PyYAML>=6.0.2",
    "rich>=13.9.0",
    "requests>=2.32.0",
    "filelock>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
free-tier-hunter = "free_tier_hunter.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
